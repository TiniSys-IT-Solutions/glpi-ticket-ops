name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes gettext rsync
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, simplexml
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: ./scripts/build-release.sh "${GITHUB_REF_NAME}"
      - name: Prepare release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## ${VERSION}/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > dist/release-notes.md
          test -s dist/release-notes.md || printf 'Ticket Operations %s\n' "${GITHUB_REF_NAME}" > dist/release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="dist/glpi-ticket-operations-${VERSION}.zip"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ARCHIVE}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${ARCHIVE}" \
              --title "Ticket Operations ${GITHUB_REF_NAME}" \
              --notes-file dist/release-notes.md
          fi
