name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes gettext rsync
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, simplexml
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer quality
      - run: node --check public/js/ticketoperations.js
      - run: php -r '$xml = simplexml_load_file("ticketoperations.xml"); exit($xml === false ? 1 : 0);'
      - run: ./scripts/build-release.sh

  glpi-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: glpi
          MARIADB_USER: glpi
          MARIADB_PASSWORD: glpi
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          path: ticketoperations-source
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, gd, intl, mysqli, simplexml, zip
          coverage: none
      - name: Install GLPI 11.0.8
        run: |
          curl --fail --location --output glpi.tgz \
            https://github.com/glpi-project/glpi/releases/download/11.0.8/glpi-11.0.8.tgz
          tar -xzf glpi.tgz
          php glpi/bin/console database:install \
            --db-host=127.0.0.1 --db-name=glpi --db-user=glpi --db-password=glpi \
            --no-interaction
      - name: Install plugin dependencies
        run: |
          mv ticketoperations-source glpi/plugins/ticketoperations
          composer install --working-dir=glpi/plugins/ticketoperations --no-interaction --prefer-dist
          touch glpi/.ticketoperations-disposable-test
      - name: Run native GLPI foundation test
        run: |
          TICKETOPERATIONS_TEST_GLPI_ROOT="$PWD/glpi" \
            php glpi/plugins/ticketoperations/tests/Integration/foundation.php

