name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes gettext rsync ripgrep
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, simplexml
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer quality
      - run: node --check public/js/ticketoperations.js
      - run: |
          php -r '$xml = simplexml_load_file("ticketops.xml"); exit($xml === false ? 1 : 0);'
      - run: ./scripts/build-release.sh
